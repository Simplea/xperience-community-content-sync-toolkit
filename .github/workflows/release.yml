name: "Release: Publish NuGet package"

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: Build, validate, and publish
    runs-on: ubuntu-latest
    environment: nuget-release
    permissions:
      contents: read
      id-token: write

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_NOLOGO: 1

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify tag and release commit
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must contain a SemVer version, for example v1.0.0-beta.2."
            exit 1
          fi

          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tags must reference a commit on main."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore XperienceCommunity.ContentSyncToolkit.slnx --locked-mode

      - name: Verify formatting
        run: dotnet format XperienceCommunity.ContentSyncToolkit.slnx --exclude ./examples/** --verify-no-changes --no-restore

      - name: Build
        run: dotnet build XperienceCommunity.ContentSyncToolkit.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test XperienceCommunity.ContentSyncToolkit.slnx --configuration Release --no-build --no-restore

      - name: Pack
        run: >-
          dotnet pack
          src/XperienceCommunity.ContentSyncToolkit/XperienceCommunity.ContentSyncToolkit.csproj
          --configuration Release
          --no-build
          --no-restore
          --output artifacts
          -p:PackageVersion=${{ steps.version.outputs.version }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: XperienceCommunity.ContentSyncToolkit-${{ steps.version.outputs.version }}
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

      - name: Authenticate to NuGet.org
        uses: NuGet/login@v1
        id: nuget
        with:
          user: andresvillenas

      - name: Publish to NuGet.org
        shell: bash
        run: |
          dotnet nuget push \
            "artifacts/XperienceCommunity.ContentSyncToolkit.${{ steps.version.outputs.version }}.nupkg" \
            --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json
