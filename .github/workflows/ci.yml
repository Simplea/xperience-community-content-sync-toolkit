name: "CI: Build and Test"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  dotnet-format:
    name: .Net Format Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Run dotnet format
        run: dotnet format XperienceCommunity.ContentSyncToolkit.slnx --exclude ./examples/** --verify-no-changes

  minimum_compatibility:
    name: Minimum Xperience Compatibility
    runs-on: ubuntu-latest
    needs: dotnet-format
    defaults:
      run:
        shell: pwsh

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_NOLOGO: 1

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore minimum-version projects
        run: >-
          dotnet restore
          tests/XperienceCommunity.ContentSyncToolkit.Tests/XperienceCommunity.ContentSyncToolkit.Tests.csproj
          --locked-mode

      - name: Build minimum-version projects
        run: >-
          dotnet build
          tests/XperienceCommunity.ContentSyncToolkit.Tests/XperienceCommunity.ContentSyncToolkit.Tests.csproj
          --configuration Release
          --no-restore

      - name: Test minimum-version projects
        run: >-
          dotnet test
          tests/XperienceCommunity.ContentSyncToolkit.Tests/XperienceCommunity.ContentSyncToolkit.Tests.csproj
          --configuration Release
          --no-build
          --no-restore

  latest_integration:
    name: Latest Xperience Integration
    runs-on: ubuntu-latest
    needs: minimum_compatibility
    defaults:
      run:
        shell: pwsh

    env:
      ASPNETCORE_ENVIRONMENT: CI
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_NOLOGO: 1

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install dependencies
        run: |
          dotnet restore `
            --locked-mode

      - name: Build Solution
        run: |
          dotnet build `
            --configuration Release `
            --no-restore

      - name: Test Solution
        run: |
          dotnet test `
            --configuration Release `
            --no-build `
            --no-restore
